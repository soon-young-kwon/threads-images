name: decode-images
on:
  push:
    branches: [main]
    paths: ['incoming/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 files in incoming/ to images/
        run: |
          shopt -s nullglob
          mkdir -p images
          n=0
          for f in incoming/*.b64; do
            name="$(basename "$f" .b64)"
            base64 -d "$f" > "images/$name"
            git rm -q "$f"
            git add "images/$name"
            n=$((n+1))
          done
          if [ "$n" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Decode $n image(s) from incoming/"
            git push
          fi
